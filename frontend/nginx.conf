server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve "backend" through Docker's DNS at request time, not at startup,
    # so nginx starts even when the backend is not running yet
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    # Backend health for the UI; maps to Spring Boot Actuator
    location = /api/v1/health {
        proxy_pass $backend/actuator/health;
    }

    # With a variable and no URI, nginx forwards the original request URI
    location /api/v1/ {
        proxy_pass $backend;
    }

    # TODO: route /auth to Keycloak when it joins the Compose stack (ADR 0009)

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
