# Xray JUnit report (QA Manual 2.3): JUnit XML with the @Requirement links, imported into Xray.
# Surefire and Failsafe run in separate JVMs, so each report gets a timestamp to keep both.
report_directory=target/xray-reports
add_timestamp_to_report_filename=true
# Every JUnit test is reported, so all CI results reach Xray (PM5); a test with @Requirement
# on its method is also linked to that story. Cucumber scenarios are imported from their own report.
report_only_annotated_tests=false
