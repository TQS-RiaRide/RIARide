spring:
  application:
    name: riaride-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/riaride}
    username: ${DB_USERNAME:riaride}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      # A fractional number for a whole-number field, such as a hub capacity of 1.5, is a 400,
      # not silently truncated.
      accept-float-as-int: false
    datatype:
      enum:
        # A number for an enum, such as a vehicle type of 0, is a 400, not read as the ordinal.
        fail-on-numbers-for-enums: true
  mvc:
    problemdetails:
      enabled: true # RFC 9457 problem details for Spring MVC errors
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/riaride}

riaride:
  keycloak:
    # Service client for the Admin API, used by guest sign-up (ADR 0010).
    admin:
      base-url: ${KEYCLOAK_ADMIN_URL:http://localhost:8180}
      realm: riaride
      client-id: riaride-backend
      client-secret: ${KEYCLOAK_BACKEND_CLIENT_SECRET:}
  payments:
    # Stripe test mode (ADR 0008). The key is never committed: set STRIPE_SECRET_KEY.
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
  telemetry:
    # The simulator's broker (ADR 0006). Turned off in the tests that do not need a broker.
    mqtt:
      enabled: ${MQTT_ENABLED:true}
      url: ${MQTT_URL:tcp://localhost:1883}
      client-id: ${MQTT_CLIENT_ID:riaride-backend}
      username: ${MQTT_USERNAME:}
      password: ${MQTT_PASSWORD:}
  fleet:
    # BR12: a vehicle below this battery cannot be booked. Moves to the backoffice usage rule later.
    min-booking-battery-pct: 20
  trips:
    # BR13: a trip whose unlock telemetry does not confirm within this time fails. A trip still
    # starting exactly at the timeout has failed (RIA-54).
    unlock-timeout: 30s
    # BR11: how long a bike stays reserved for the pass.
    reservation-hold: 15m
    # How often UnlockTimeoutJob looks for starts that are overdue.
    unlock-timeout-check-interval: 5s
    # How often ReservationExpiryJob looks for holds that ended unused (BR11).
    reservation-expiry-check-interval: 30s

management:
  endpoints:
    web:
      exposure:
        include: health # only health; prometheus comes later
  endpoint:
    health:
      show-details: never # do not expose internal details publicly
