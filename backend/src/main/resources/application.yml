spring:
  application:
    name: riaride-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/riaride}
    username: ${DB_USERNAME:riaride}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true # RFC 9457 problem details for Spring MVC errors
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/riaride}

riaride:
  keycloak:
    # Service client for the Admin API, used by guest sign-up (ADR 0010).
    admin:
      base-url: ${KEYCLOAK_ADMIN_URL:http://localhost:8180}
      realm: riaride
      client-id: riaride-backend
      client-secret: ${KEYCLOAK_BACKEND_CLIENT_SECRET:}
  fleet:
    # BR12: a vehicle below this battery cannot be booked. Moves to the backoffice usage rule later.
    min-booking-battery-pct: 20

management:
  endpoints:
    web:
      exposure:
        include: health # only health; prometheus comes later
  endpoint:
    health:
      show-details: never # do not expose internal details publicly
