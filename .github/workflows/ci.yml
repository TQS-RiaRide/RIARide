name: CI

# Runs on every push and on every pull request to main.
# The "CI result" job aggregates all the others and is the single
# required status check in the main branch protection rules.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend and frontend jobs always run: if pom.xml or package.json goes
  # missing, the job fails instead of being skipped.
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, needed by SonarQube later

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit tests
        run: ./mvnw -B test

      # Integration tests (Failsafe, *IT.java) run separately from unit tests.
      # The backend pom must map skipUnitTests to Surefire's skipTests.
      - name: Integration tests
        run: ./mvnw -B verify -DskipUnitTests=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/cucumber-reports/
            backend/target/xray-reports/
          if-no-files-found: ignore

      # Checks that the Dockerfile builds; the image is not pushed here.
      - name: Build Docker image
        run: docker build -t riaride-backend:ci .

  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run format:check --if-present
      - run: npm test --if-present
      - run: npm run build

  result:
    name: CI result
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Every job must succeed: a failed, cancelled or skipped job fails
      # the whole pipeline, so a missing build can never pass this check.
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              exit 1
            fi
          done
