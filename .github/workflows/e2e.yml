name: E2E

# Playwright end-to-end and accessibility tests of the web UI against the Compose stack
# (QA Manual 5.3 and 5.4). They run outside the regular build: nightly on main, and on demand,
# so the author of a story that changes a core UI flow links a green run in the pull request (QA
# Manual 4.1). On demand means either "Run workflow" on a branch, or adding the label `e2e` to a
# pull request (needed until this workflow is on main, since GitHub offers "Run workflow" only for
# workflows on the default branch). Every password is generated for the run and never leaves it.

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC, on the default branch (main)
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

# Another label added to the pull request (ai:*) must not cancel a run, so only runs started the
# same way share a group.
concurrency:
  group: e2e-${{ github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright against the Compose stack
    if: github.event_name != 'pull_request' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate infra/.env with passwords for this run only
        run: |
          secret() { openssl rand -hex 24; }
          dev_password="$(secret)"
          echo "::add-mask::$dev_password"
          {
            echo "POSTGRES_PASSWORD=$(secret)"
            echo "KEYCLOAK_DB_PASSWORD=$(secret)"
            echo "KEYCLOAK_ADMIN_USERNAME=admin"
            echo "KEYCLOAK_ADMIN_PASSWORD=$(secret)"
            echo "DEV_USER_PASSWORD=$dev_password"
          } > infra/.env
          echo "DEV_USER_PASSWORD=$dev_password" >> "$GITHUB_ENV"

      - name: Start the stack (database, Keycloak, broker, backend, frontend)
        run: docker compose -f infra/compose.yaml --profile app up -d --build --wait --wait-timeout 300

      - name: Create the synthetic dev users
        run: infra/keycloak/create-dev-users.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # No dependency needs an install script, so none runs; the browser comes from the Playwright
      # version locked in package-lock.json, never from a package npx would fetch.
      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Type check
        working-directory: e2e
        run: npm run typecheck

      - name: Run the end-to-end tests
        working-directory: e2e
        run: npm test

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      # On main only, as for the other reports (QA Manual 2.3): a run on a branch is evidence for
      # its pull request, not for the iteration. Failed runs are imported too, so a failing test
      # shows as failing in Xray. Each test carries its story in a "requirements" property.
      - name: Import the results into Xray
        if: always() && github.ref == 'refs/heads/main' && hashFiles('e2e/test-results/junit.xml') != ''
        uses: mikepenz/xray-action@93fcac936537e41c08c7191229e6106ae511f0da # v4.2.0
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          xrayCloud: "true"
          testFormat: junit
          testPaths: "e2e/test-results/junit.xml"
          combineInSingleTestExec: "true"
          projectKey: RIA
          testPlanKey: ${{ vars.XRAY_TEST_PLAN_KEY }}
          failOnImportError: "true"

      - name: Show the logs of the stack
        if: failure()
        run: docker compose -f infra/compose.yaml --profile app logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose -f infra/compose.yaml --profile app down -v
