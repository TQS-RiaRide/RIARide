name: E2E

# Playwright end-to-end and accessibility tests of the web UI against the Compose stack
# (QA Manual 5.3 and 5.4). They run outside the regular build: nightly on main, and on demand on
# any branch, so the author of a story that changes a core UI flow links a green run in the pull
# request (QA Manual 4.1). Every password is generated for the run and never leaves it.

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC, on the default branch (main)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright against the Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate infra/.env with passwords for this run only
        run: |
          secret() { openssl rand -hex 24; }
          dev_password="$(secret)"
          echo "::add-mask::$dev_password"
          {
            echo "POSTGRES_PASSWORD=$(secret)"
            echo "KEYCLOAK_DB_PASSWORD=$(secret)"
            echo "KEYCLOAK_ADMIN_USERNAME=admin"
            echo "KEYCLOAK_ADMIN_PASSWORD=$(secret)"
            echo "DEV_USER_PASSWORD=$dev_password"
          } > infra/.env
          echo "DEV_USER_PASSWORD=$dev_password" >> "$GITHUB_ENV"

      - name: Start the stack (database, Keycloak, broker, backend, frontend)
        run: docker compose -f infra/compose.yaml --profile app up -d --build --wait --wait-timeout 300

      - name: Create the synthetic dev users
        run: infra/keycloak/create-dev-users.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type check
        working-directory: e2e
        run: npm run typecheck

      - name: Run the end-to-end tests
        working-directory: e2e
        run: npm test

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Show the logs of the stack
        if: failure()
        run: docker compose -f infra/compose.yaml --profile app logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose -f infra/compose.yaml --profile app down -v
