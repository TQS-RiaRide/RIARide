name: Xray import

# Sends the test results of every CI run on main to Xray Cloud, so each
# story's requirement coverage reflects the latest build (QA Manual, 2.3).
# Each run creates at most four Test Executions in the iteration's Test Plan:
# one for the backend JUnit XML reports, one for the frontend's Vitest JUnit
# XML report, one for the simulator's pytest JUnit XML reports and one for the
# Cucumber JSON reports. Each import is its own request, so they cannot share one.
#
# It can also be started by hand with the id of an earlier CI run on main, to
# import that run again after an import failed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id of the CI run on main to import (the number in its URL)"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  import:
    name: Import results into Xray
    # Import failed runs too: a failing test must show as failing in Xray.
    # Skip cancelled or skipped runs, which have no complete reports.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
    steps:
      # A run started by hand must name a completed CI run of a push to main,
      # so no other branch's results reach the iteration's Test Plan.
      - name: Check the CI run to import
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$RUN_ID" in
            ''|*[!0-9]*) echo "::error::run_id must be the numeric id of a CI run."; exit 1 ;;
          esac
          # By the workflow file, not its display name, which a rename would change.
          run=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
            --jq '[.path, .head_branch, .event, .conclusion] | join(" ")')
          ci=".github/workflows/ci.yml main push"
          if [ "$run" != "$ci success" ] && [ "$run" != "$ci failure" ]; then
            echo "::error::Run $RUN_ID is not a completed CI run of a push to main ($run)."
            exit 1
          fi

      # An unset secret or variable expands to an empty string, which would
      # import without a Test Plan or fail with an unclear Xray error.
      - name: Check Xray configuration
        env:
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
          XRAY_TEST_PLAN_KEY: ${{ vars.XRAY_TEST_PLAN_KEY }}
        run: |
          missing=""
          [ -n "$XRAY_CLIENT_ID" ] || missing="$missing XRAY_CLIENT_ID (secret)"
          [ -n "$XRAY_CLIENT_SECRET" ] || missing="$missing XRAY_CLIENT_SECRET (secret)"
          [ -n "$XRAY_TEST_PLAN_KEY" ] || missing="$missing XRAY_TEST_PLAN_KEY (variable)"
          if [ -n "$missing" ]; then
            echo "::error::Xray import is not configured. Missing:$missing. See QA Manual, section 2.3."
            exit 1
          fi

      # With a pattern, no matching artifact is not an error: nothing is
      # downloaded and the import steps below are skipped. If a check above
      # failed, this step is skipped too, so no report exists and none is imported.
      - name: Download test reports from the CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-test-reports"
          path: reports
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import JUnit results
        # The Xray JUnit reports: every JUnit result, with the @Requirement links (QA Manual 2.3).
        # The plain Surefire and Failsafe reports hold the same results without the links.
        # !cancelled(): each import runs even if an earlier one failed, so one
        # rejected report does not hide the others; the job still fails.
        if: ${{ !cancelled() && hashFiles('reports/**/xray-reports/TEST-junit-jupiter-*.xml') != '' }}
        uses: mikepenz/xray-action@93fcac936537e41c08c7191229e6106ae511f0da # v4.2.0
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          xrayCloud: "true"
          testFormat: junit
          testPaths: "reports/**/xray-reports/TEST-junit-jupiter-*.xml"
          combineInSingleTestExec: "true"
          projectKey: RIA
          testPlanKey: ${{ vars.XRAY_TEST_PLAN_KEY }}
          # The action ignores import errors by default; fail the job instead.
          failOnImportError: "true"

      - name: Import frontend results
        # Vitest JUnit XML; each test carries its story in a "requirements" property.
        if: ${{ !cancelled() && hashFiles('reports/frontend-test-reports/frontend-*.xml') != '' }}
        uses: mikepenz/xray-action@93fcac936537e41c08c7191229e6106ae511f0da # v4.2.0
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          xrayCloud: "true"
          testFormat: junit
          testPaths: "reports/frontend-test-reports/frontend-*.xml"
          combineInSingleTestExec: "true"
          projectKey: RIA
          testPlanKey: ${{ vars.XRAY_TEST_PLAN_KEY }}
          failOnImportError: "true"

      - name: Import simulator results
        # pytest JUnit XML; each test carries its story in a "requirements" property.
        if: ${{ !cancelled() && hashFiles('reports/simulator-test-reports/simulator-*.xml') != '' }}
        uses: mikepenz/xray-action@93fcac936537e41c08c7191229e6106ae511f0da # v4.2.0
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          xrayCloud: "true"
          testFormat: junit
          testPaths: "reports/simulator-test-reports/simulator-*.xml"
          combineInSingleTestExec: "true"
          projectKey: RIA
          testPlanKey: ${{ vars.XRAY_TEST_PLAN_KEY }}
          failOnImportError: "true"

      - name: Import Cucumber results
        if: ${{ !cancelled() && hashFiles('reports/**/cucumber*.json') != '' }}
        uses: mikepenz/xray-action@93fcac936537e41c08c7191229e6106ae511f0da # v4.2.0
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          xrayCloud: "true"
          testFormat: cucumber
          testPaths: "reports/**/cucumber*.json"
          combineInSingleTestExec: "true"
          projectKey: RIA
          testPlanKey: ${{ vars.XRAY_TEST_PLAN_KEY }}
          failOnImportError: "true"
