# SonarQube Cloud analysis, run by the "sonar" job in .github/workflows/ci.yml
# (QA Manual, section 3.3). The quality gate and quality profile are managed
# in SonarQube Cloud; the coverage exclusions are listed here.
sonar.organization=tqs-riaride
sonar.projectKey=TQS-RiaRide_RIARide
sonar.projectName=RIARide
sonar.sourceEncoding=UTF-8

# Analysis scope. SonarQube Cloud's new analysis scope analyzes the whole
# repository and ignores sonar.sources, sonar.tests and sonar.test.inclusions,
# so test code is left out with sonar.exclusions instead. Otherwise the Java
# tests are analyzed as production code and counted as uncovered lines.
# docs/ holds reports and PDFs, not code.
sonar.exclusions=backend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/setupTests.ts,simulator/tests/**,tools/ai-review-findings/tests/**,docs/**

# Coverage exclusions, by path only (QA Manual, section 3.3): entry points,
# the Spring configuration classes that only wire beans (named one by one, so a
# new configuration class is measured until it is added here), and generated
# code. A file with logic is measured: SecurityConfiguration (access rules),
# StripeConfiguration (test mode key check), the *Properties classes and the
# web request and response records stay in. Adding an exclusion is a change to
# the QA Manual, and the same list is mirrored in backend/pom.xml (JaCoCo),
# frontend/vite.config.ts (Vitest) and simulator/pyproject.toml (coverage.py).
sonar.coverage.exclusions=\
  backend/src/main/java/com/riaride/RiaRideApplication.java,\
  backend/src/main/java/com/riaride/ClockConfiguration.java,\
  backend/src/main/java/com/riaride/accounts/internal/application/AccountsConfiguration.java,\
  backend/src/main/java/com/riaride/accounts/internal/keycloak/KeycloakConfiguration.java,\
  backend/src/main/java/com/riaride/fleet/internal/application/FleetConfiguration.java,\
  backend/src/main/java/com/riaride/trips/internal/application/TripsConfiguration.java,\
  backend/src/main/java/com/riaride/telemetry/internal/mqtt/DisabledMqttConfiguration.java,\
  backend/src/main/java/com/riaride/telemetry/internal/mqtt/TelemetryMqttConfiguration.java,\
  frontend/src/main.tsx,\
  frontend/src/**/*.gen.*,\
  simulator/src/riaride_simulator/__main__.py

# Backend: compiled classes and JaCoCo report (unit and integration tests),
# downloaded from the backend job.
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
# Dependency jars, copied by the sonar job (test scope includes compile and runtime).
sonar.java.libraries=backend/target/dependency/*.jar
sonar.java.test.libraries=backend/target/dependency/*.jar
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Frontend: Vitest LCOV report, downloaded from the frontend job.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Simulator and tools: coverage.py XML reports (the simulator's unit and
# integration tests combined), downloaded from the simulator and tools jobs.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=simulator/coverage.xml,tools/ai-review-findings/coverage.xml
